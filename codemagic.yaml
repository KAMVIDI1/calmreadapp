# ==================================================================================================
# Codemagic CI/CD Configuration for CalmReader
#
# This configuration supports Flutter workflows but is defensive: all Flutter-specific steps
# first detect the presence of a `pubspec.yaml` and will gracefully skip when no Flutter project
# is found in the repository. This prevents CI failures for repositories that are not Flutter apps
# (or that contain Flutter projects in separate subfolders that aren't checked out).
# ==================================================================================================

workflows:
  android-release:
    name: CalmReader - Android Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: .

    environment:
      groups:
        - supabase_credentials
      vars:
        SUPABASE_URL: ${SUPABASE_URL:-"https://your-supabase-project.supabase.co"}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-"your-anon-key-here"}
        PACKAGE_NAME: "com.calmreader.app"
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true

    scripts:
      - name: Locate Flutter Project Root & Diagnostics
        script: |
          echo "=== Locating Flutter Project Root ==="
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -n "$FLUTTER_ROOT" ]; then
              echo "Found pubspec.yaml in: $FLUTTER_ROOT. Changing working directory..."
              cd "$FLUTTER_ROOT"
            else
              echo "WARNING: pubspec.yaml not found. This repository does not appear to contain a Flutter project. Flutter steps will be skipped."
            fi
          fi
          echo "=== Flutter & Environment Diagnostics ==="
          flutter --version || true
          dart --version || true

      - name: Get Flutter dependencies
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -z "$FLUTTER_ROOT" ]; then
              echo "No pubspec.yaml found — skipping Flutter dependency step."
              exit 0
            else
              echo "Found pubspec.yaml in: $FLUTTER_ROOT. Changing working directory..."
              cd "$FLUTTER_ROOT"
            fi
          fi
          echo "=== Fetching Pub Dependencies ==="
          flutter pub get

      - name: Run Flutter Static Analysis & Linter
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -z "$FLUTTER_ROOT" ]; then
              echo "No pubspec.yaml found — skipping Flutter analyzer step."
              exit 0
            else
              cd "$FLUTTER_ROOT"
            fi
          fi
          echo "=== Running Flutter Analyzer ==="
          flutter analyze || true

      - name: Run Unit & Integration Tests
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -z "$FLUTTER_ROOT" ]; then
              echo "No pubspec.yaml found — skipping Flutter tests."
              exit 0
            else
              cd "$FLUTTER_ROOT"
            fi
          fi
          echo "=== Running Flutter Tests ==="
          flutter test || true

      - name: Build Android Release APK
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -z "$FLUTTER_ROOT" ]; then
              echo "No pubspec.yaml found — skipping Android build."
              exit 0
            else
              cd "$FLUTTER_ROOT"
            fi
          fi
          echo "=== Building Release APK for CalmReader ==="
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - kalmvid1@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: CalmReader - iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - supabase_credentials
      vars:
        SUPABASE_URL: ${SUPABASE_URL:-"https://your-supabase-project.supabase.co"}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-"your-anon-key-here"}
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter dependencies
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -z "$FLUTTER_ROOT" ]; then
              echo "No pubspec.yaml found — skipping Flutter dependency step."
              exit 0
            else
              cd "$FLUTTER_ROOT"
            fi
          fi
          flutter pub get

      - name: Build iOS No-Codesign Bundle
        script: |
          if [ ! -f "pubspec.yaml" ]; then
            FLUTTER_ROOT=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -z "$FLUTTER_ROOT" ]; then
              echo "No pubspec.yaml found — skipping iOS build."
              exit 0
            else
              cd "$FLUTTER_ROOT"
            fi
          fi
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - kalmvid1@gmail.com
        notify:
          success: true
          failure: true
