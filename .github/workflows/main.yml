name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: |
          cd calmreadapp
          flutter pub get

      - name: Build APK
        run: |
          cd calmreadapp
          flutter build apk --release

      - name: List files (debug)
        run: |
          ls -la calmreadapp/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calmreader-app
          path: calmreadapp/build/app/outputs/flutter-apk/app-release.apk
