# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.useAndroidX=true
android.enableJetifier=true
# org.gradle.java.home is intentionally unset so Gradle uses the runner-provided JDK
# Increase Gradle JVM heap to avoid "Java heap space" during native lib transforms
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Memory stability in constrained envs (Codespaces/CI, ~8 GB RAM, no swap):
# compile Kotlin in-process instead of a separate ~4G daemon, and disable
# parallel task execution to avoid memory spikes that OOM-kill the daemon.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
